<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Direktori P3K — Smart First Aid</title>

<meta name="theme-color" content="#e11d48">
<link rel="manifest" href="manifest.json">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#f7f8fc;
    --card:#ffffff;
    --text:#111827;
    --muted:#64748b;
    --border:#e5e7eb;
    --primary:#e11d48;
    --primary2:#be123c;
    --soft:#fff1f2;
    --green:#16a34a;
    --blue:#2563eb;
    --orange:#f97316;
    --yellow:#f59e0b;
    --shadow:0 15px 40px rgba(15,23,42,.08);
}

body.dark{
    --bg:#080b12;
    --card:#111827;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#1f2937;
    --soft:#3b1019;
    --shadow:0 15px 40px rgba(0,0,0,.3);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:.3s;
}

/* =========================
   HEADER
========================= */

header{
    background:
        radial-gradient(circle at 90% 10%,rgba(255,255,255,.18),transparent 25%),
        radial-gradient(circle at 10% 90%,rgba(255,255,255,.08),transparent 25%),
        linear-gradient(135deg,#e11d48,#9f1239);
    color:white;
    padding:28px 20px 100px;
    border-radius:0 0 40px 40px;
}

.header{
    max-width:1100px;
    margin:auto;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:50px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:bold;
}

.logo-icon{
    width:44px;
    height:44px;
    display:grid;
    place-items:center;
    background:rgba(255,255,255,.16);
    border-radius:14px;
    font-size:23px;
}

.version{
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.2);
    padding:8px 12px;
    border-radius:30px;
    font-size:11px;
}

.hero{
    max-width:720px;
}

.hero-badge{
    display:inline-flex;
    gap:7px;
    align-items:center;
    padding:8px 13px;
    border-radius:30px;
    background:rgba(255,255,255,.14);
    font-size:12px;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(35px,7vw,64px);
    line-height:1;
    letter-spacing:-2px;
    margin-bottom:18px;
}

.hero p{
    max-width:650px;
    line-height:1.7;
    opacity:.9;
}

/* =========================
   MAIN
========================= */

.container{
    max-width:1100px;
    margin:-55px auto 0;
    padding:0 20px 60px;
}

/* =========================
   SEARCH
========================= */

.search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--border);
    padding:8px;
    border-radius:20px;
    box-shadow:var(--shadow);
}

.search-icon{
    padding-left:12px;
    font-size:20px;
}

.search-box input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    padding:14px 4px;
    font-size:15px;
}

.theme-btn{
    width:48px;
    height:48px;
    border:0;
    border-radius:15px;
    cursor:pointer;
    background:var(--soft);
    font-size:20px;
}

/* =========================
   QUICK ACTION
========================= */

.quick-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin:18px 0;
}

.action-btn{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:20px;
    padding:20px;
    cursor:pointer;
    text-align:left;
    transition:.25s;
}

.action-btn:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow);
}

.action-btn:active{
    transform:scale(.98);
}

.action-icon{
    font-size:27px;
    margin-bottom:12px;
}

.action-btn strong{
    display:block;
    margin-bottom:5px;
}

.action-btn span{
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

.action-danger{
    background:linear-gradient(135deg,#ef4444,#be123c);
    color:white;
    border:0;
}

.action-danger span{
    color:#ffe4e6;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:20px 0;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
}

.stat-icon{
    font-size:20px;
    margin-bottom:10px;
}

.stat-number{
    color:var(--primary);
    font-size:26px;
    font-weight:bold;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

/* =========================
   SECTION
========================= */

.section{
    margin-top:32px;
}

.section-head{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:15px;
    margin-bottom:15px;
}

.section-head h2{
    font-size:23px;
}

.section-head p{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

/* =========================
   CATEGORY
========================= */

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
}

.category{
    white-space:nowrap;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:30px;
    padding:10px 15px;
    cursor:pointer;
    font-size:12px;
}

.category.active{
    background:var(--primary);
    color:white;
    border-color:var(--primary);
}

/* =========================
   CARDS
========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:16px;
}

.card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:21px;
    overflow:hidden;
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:var(--shadow);
}

.card.hidden{
    display:none;
}

.card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.card-icon{
    width:55px;
    height:55px;
    display:grid;
    place-items:center;
    background:var(--soft);
    border-radius:17px;
    font-size:28px;
}

.star{
    border:0;
    background:transparent;
    cursor:pointer;
    font-size:27px;
    color:#fbbf24;
    transition:.2s;
}

.star:hover{
    transform:scale(1.2);
}

.card h3{
    margin:18px 0 8px;
}

.card p{
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
    min-height:42px;
}

.card-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:18px;
}

.tag{
    color:var(--muted);
    font-size:10px;
    background:var(--bg);
    border:1px solid var(--border);
    padding:7px 9px;
    border-radius:20px;
}

.guide{
    border:0;
    color:white;
    background:var(--primary);
    padding:10px 13px;
    border-radius:11px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   RECENT
========================= */

.recent{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
    display:none;
    margin-top:18px;
}

.recent.show{
    display:block;
}

.recent button{
    border:0;
    background:transparent;
    color:var(--primary);
    font-weight:bold;
    margin-top:8px;
    cursor:pointer;
}

/* =========================
   CHECKLIST
========================= */

.checklist{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:22px;
}

.progress{
    height:9px;
    background:var(--bg);
    border-radius:20px;
    overflow:hidden;
    margin:14px 0 20px;
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#16a34a,#22c55e);
    transition:.3s;
}

.check-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--border);
    cursor:pointer;
}

.check-item:last-child{
    border-bottom:0;
}

.check-item input{
    width:18px;
    height:18px;
    accent-color:var(--primary);
}

.check-item span{
    font-size:14px;
}

/* =========================
   QUIZ
========================= */

.quiz{
    background:linear-gradient(135deg,#1d4ed8,#4f46e5);
    color:white;
    border-radius:25px;
    padding:25px;
}

.quiz-question{
    font-size:18px;
    font-weight:bold;
    line-height:1.5;
    margin-bottom:17px;
}

.quiz-options{
    display:grid;
    gap:9px;
}

.quiz-option{
    text-align:left;
    padding:13px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.1);
    color:white;
    border-radius:13px;
    cursor:pointer;
}

.quiz-option:hover{
    background:rgba(255,255,255,.2);
}

.quiz-option.correct{
    background:#16a34a;
}

.quiz-option.wrong{
    background:#dc2626;
}

.quiz-result{
    margin-top:15px;
    font-weight:bold;
    min-height:20px;
}

.quiz-next{
    margin-top:15px;
    border:0;
    padding:11px 15px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

/* =========================
   FEEDBACK
========================= */

.feedback-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:22px;
}

.rating{
    display:flex;
    gap:6px;
    margin:15px 0;
}

.rating button{
    border:0;
    background:transparent;
    font-size:28px
